name: Build SHADER ART debug APK

# Builds the debug APK from SHADER-ART-v0.01.zip (placed at the repository root).
# Run it automatically on every push, or manually: Actions tab -> "Build SHADER ART debug APK" -> Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Find the project (extract the ZIP if present)
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname 'SHADER-ART-v0.01.zip' -print -quit)"
          if [ -n "$ZIP" ]; then
            echo "Found archive: $ZIP"
            unzip -q -o "$ZIP" -d "$RUNNER_TEMP/shader-art-src"
            SEARCH_DIR="$RUNNER_TEMP/shader-art-src"
          else
            echo "No SHADER-ART-v0.01.zip at the repository root; looking for an already-extracted project."
            SEARCH_DIR="."
          fi
          SETTINGS="$(find "$SEARCH_DIR" -maxdepth 4 -type f -name 'settings.gradle.kts' -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::Could not find settings.gradle.kts. Put SHADER-ART-v0.01.zip in the repository root (next to the .github folder)."
            exit 1
          fi
          ROOT="$(cd "$(dirname "$SETTINGS")" && pwd)"
          echo "Gradle project root: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Verify the Gradle wrapper is real
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew || { echo "::error::gradlew is missing"; exit 1; }
          test -f gradle/wrapper/gradle-wrapper.jar || { echo "::error::gradle-wrapper.jar is missing"; exit 1; }
          test -f gradle/wrapper/gradle-wrapper.properties || { echo "::error::gradle-wrapper.properties is missing"; exit 1; }
          unzip -tq gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare the Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f -print -quit)"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$SDK" > "${{ steps.locate.outputs.root }}/local.properties"

      - name: Unit tests
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Lint (report only; does not block the APK)
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug APK
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify the APK
        id: verify
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::No debug APK was produced."
            exit 1
          fi
          unzip -tq "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion" || true
            if "$AAPT2" dump permissions "$APK" | grep -qi 'INTERNET'; then
              echo "::error::The APK requests the INTERNET permission, which SHADER ART must not have."
              exit 1
            fi
            echo "Confirmed: the APK does not request the INTERNET permission."
          fi
          mkdir -p "$RUNNER_TEMP/apk-out"
          cp "$APK" "$RUNNER_TEMP/apk-out/SHADER-ART-v0.01-debug.apk"
          ls -l "$RUNNER_TEMP/apk-out"
          echo "apk=$RUNNER_TEMP/apk-out/SHADER-ART-v0.01-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SHADER-ART-v0.01-debug-APK
          path: ${{ steps.verify.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHADER-ART-v0.01-reports
          path: |
            ${{ steps.locate.outputs.root }}/app/build/reports/tests/
            ${{ steps.locate.outputs.root }}/app/build/reports/lint-results-debug.html
            ${{ steps.locate.outputs.root }}/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
